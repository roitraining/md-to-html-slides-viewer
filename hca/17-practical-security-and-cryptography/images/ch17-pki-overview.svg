<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" font-size="28" font-weight="bold" fill="#003865">PKI: Binding Keys to Identity</text>

  <rect x="40" y="120" width="520" height="300" rx="20" fill="#c3d7ea" stroke="#003865" stroke-width="2"/>
  <text x="300" y="168" text-anchor="middle" font-size="20" font-weight="bold" fill="#003865">What PKI Provides</text>
  <text x="300" y="284" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">Identity binding</text>
  <text x="300" y="310" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">A chain of trust to a root</text>
  <text x="300" y="336" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">Revocation when compromised</text>

  <rect x="640" y="120" width="520" height="300" rx="20" fill="#e8eef5" stroke="#003865" stroke-width="2"/>
  <text x="900" y="168" text-anchor="middle" font-size="20" font-weight="bold" fill="#003865">Where You'll See It</text>
  <text x="900" y="284" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">TLS / HTTPS certificates</text>
  <text x="900" y="310" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">Code signing</text>
  <text x="900" y="336" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">Client certs &amp; S/MIME email</text>
</svg>
