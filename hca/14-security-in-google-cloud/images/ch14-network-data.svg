<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" font-size="28" font-weight="bold" fill="#003865">Network and Data Protection</text>

  <rect x="40" y="120" width="520" height="300" rx="20" fill="#c3d7ea" stroke="#003865" stroke-width="2"/>
  <text x="300" y="168" text-anchor="middle" font-size="21" font-weight="bold" fill="#003865">Network Isolation</text>
  <text x="300" y="290" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">VPCs &amp; Shared VPC</text>
  <text x="300" y="316" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">Firewall rules (deny by default)</text>
  <text x="300" y="342" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">VPC Service Controls</text>

  <rect x="640" y="120" width="520" height="300" rx="20" fill="#e8eef5" stroke="#003865" stroke-width="2"/>
  <text x="900" y="168" text-anchor="middle" font-size="21" font-weight="bold" fill="#003865">Data Protection</text>
  <text x="900" y="290" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">Cloud KMS (CMEK / HSM)</text>
  <text x="900" y="316" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">Encryption at rest &amp; in transit</text>
  <text x="900" y="342" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">Sensitive Data Protection (DLP)</text>
</svg>
