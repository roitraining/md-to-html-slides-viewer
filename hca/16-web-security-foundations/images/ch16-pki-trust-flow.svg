<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f6da8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" font-size="28" font-weight="bold" fill="#003865">How PKI Establishes Trust</text>

  <line x1="288" y1="250" x2="312" y2="250" stroke="#0f6da8" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="568" y1="250" x2="592" y2="250" stroke="#0f6da8" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="848" y1="250" x2="872" y2="250" stroke="#0f6da8" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="40" y="140" width="248" height="220" rx="18" fill="#c3d7ea" stroke="#003865" stroke-width="2"/>
  <text x="164" y="242" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">Key Pair</text>
  <text x="164" y="266" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">Generated</text>

  <rect x="320" y="140" width="248" height="220" rx="18" fill="#c3d7ea" stroke="#003865" stroke-width="2"/>
  <text x="444" y="242" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">CSR Submitted</text>
  <text x="444" y="266" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">to CA</text>

  <rect x="600" y="140" width="248" height="220" rx="18" fill="#c3d7ea" stroke="#003865" stroke-width="2"/>
  <text x="724" y="242" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">CA Signs</text>
  <text x="724" y="266" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">Certificate</text>

  <rect x="880" y="140" width="248" height="220" rx="18" fill="#c3d7ea" stroke="#003865" stroke-width="2"/>
  <text x="1004" y="242" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">Trusted by</text>
  <text x="1004" y="266" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">Clients</text>
</svg>
