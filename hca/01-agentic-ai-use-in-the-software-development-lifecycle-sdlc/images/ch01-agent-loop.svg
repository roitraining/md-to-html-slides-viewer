<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f6da8"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="520" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" font-size="28" font-weight="bold" fill="#003865">The Agent Loop</text>

  <line x1="288" y1="245" x2="312" y2="245" stroke="#0f6da8" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="568" y1="245" x2="592" y2="245" stroke="#0f6da8" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="848" y1="245" x2="872" y2="245" stroke="#0f6da8" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="40" y="135" width="248" height="220" rx="18" fill="#c3d7ea" stroke="#003865" stroke-width="2"/>
  <text x="164" y="235" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">Understand</text>
  <text x="164" y="259" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">Goal</text>

  <rect x="320" y="135" width="248" height="220" rx="18" fill="#c3d7ea" stroke="#003865" stroke-width="2"/>
  <text x="444" y="235" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">Plan Next</text>
  <text x="444" y="259" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">Step</text>

  <rect x="600" y="135" width="248" height="220" rx="18" fill="#c3d7ea" stroke="#003865" stroke-width="2"/>
  <text x="724" y="235" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">Act</text>
  <text x="724" y="259" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">(Use a Tool)</text>

  <rect x="880" y="135" width="248" height="220" rx="18" fill="#c3d7ea" stroke="#003865" stroke-width="2"/>
  <text x="1004" y="235" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">Check</text>
  <text x="1004" y="259" text-anchor="middle" font-size="16" font-weight="bold" fill="#003865">Result</text>

  <text x="600" y="420" text-anchor="middle" font-size="17" fill="#5b7591">Repeats until the goal is met, then reports back</text>
</svg>
