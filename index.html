<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROI Training Course Slide Viewer</title>
    <!-- Slide Viewer Styling -->
    <link rel="stylesheet" href="style.css">
    <!-- Highlight.js CSS for Code Blocks -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="highlight-theme">
</head>
<body>
    <!-- Top Progress Bar -->
    <div id="progress-bar-container" class="progress-bar-container">
        <div id="progress-bar" class="progress-bar"></div>
    </div>

    <!-- Header Toolbar (Hidden in Fullscreen Mode) -->
    <header class="toolbar">
        <button id="menu-toggle" class="hamburger" aria-label="Open Slide List" title="Slide Drawer (☰)">&#9776;</button>
        <div id="course-title" class="toolbar-title">ROI Training Presentation</div>
        
        <div class="toolbar-controls">
            <button id="fullscreen-toggle" class="icon-btn" aria-label="Toggle Fullscreen" title="Toggle Fullscreen (F)">⛶</button>
            <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme" title="Toggle Theme (Light/Dark)">🌙</button>
            <div class="font-controls">
                <button id="font-decrease" class="font-btn" aria-label="Decrease Font Size" title="Decrease Font Size">A-</button>
                <button id="font-increase" class="font-btn" aria-label="Increase Font Size" title="Increase Font Size">A+</button>
            </div>
        </div>
    </header>

    <!-- Slide Presentation Stage -->
    <main id="presentation-stage" class="presentation-stage">
        <button id="stage-prev-btn" class="nav-arrow prev-arrow" aria-label="Previous Slide" title="Previous Slide (← / PageUp)">&#10094;</button>
        
        <div id="slide-card" class="slide-card">
            <!-- Top Dark Blue Accent Line -->
            <div class="slide-top-bar"></div>
            
            <!-- Slide Body Content -->
            <div id="slide-body" class="slide-body">
                <div class="slide-loading">Loading course slides...</div>
            </div>

            <!-- Integrated ROI Training Footer -->
            <footer class="roi-slide-footer">
                <div id="footer-course-title" class="footer-cell footer-course">815: Hands-On Terraform</div>
                
                <div id="footer-copyright" class="footer-cell footer-copyright">
                    © 2026 Copyright ROI Training, Inc.<br>
                    All rights reserved. Not to be reproduced without prior written consent.
                </div>
                
                <div class="footer-cell footer-logo">
                    <svg class="roi-logo-svg" viewBox="0 0 240 40" width="150" height="25" aria-hidden="true">
                        <!-- Globe Icon -->
                        <g transform="translate(10, 5)">
                            <circle cx="15" cy="15" r="13" fill="none" stroke="#003865" stroke-width="2"/>
                            <!-- Latitude line -->
                            <line x1="2" y1="15" x2="28" y2="15" stroke="#003865" stroke-width="1.5"/>
                            <!-- Curved Longitude lines -->
                            <ellipse cx="15" cy="15" rx="7" ry="13" fill="none" stroke="#003865" stroke-width="1.5"/>
                            <!-- Orbit arrow -->
                            <path d="M 3 20 A 14 14 0 0 1 27 10" fill="none" stroke="#005699" stroke-width="2" stroke-dasharray="2 2"/>
                            <polygon points="27,6 29,12 23,10" fill="#005699"/>
                        </g>
                        <!-- Text: ROI Training -->
                        <text x="50" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#003865" letter-spacing="-0.5">ROI Training</text>
                    </svg>
                </div>
                
                <div id="footer-slide-number" class="footer-cell footer-number">1-1</div>
            </footer>
        </div>

        <button id="stage-next-btn" class="nav-arrow next-arrow" aria-label="Next Slide" title="Next Slide (→ / Space / PageDown)">&#10095;</button>
    </main>

    <!-- Slide Drawer / Table of Contents -->
    <nav id="side-menu" class="side-menu">
        <div class="menu-header">
            <h2>Course Slides</h2>
            <button id="close-menu" class="close-btn" aria-label="Close Slide List">&times;</button>
        </div>
        <ul id="slide-list"></ul>
    </nav>

    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for Code Syntax Highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- Slide Viewer App Logic -->
    <script src="app.js"></script>
</body>
</html>
