<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROI Training Course Slide Viewer</title>
    <!-- Slide Viewer Styling -->
    <link rel="stylesheet" href="style.css">
    <!-- Highlight.js CSS for Code Blocks -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="highlight-theme">
</head>
<body>
    <!-- Top Progress Bar -->
    <div id="progress-bar-container" class="progress-bar-container">
        <div id="progress-bar" class="progress-bar"></div>
    </div>

    <!-- Header Toolbar (Hidden in Fullscreen Mode) -->
    <header class="toolbar">
        <button id="menu-toggle" class="hamburger" aria-label="Open Slide List" title="Slide Drawer (☰)">&#9776;</button>
        <div id="course-title" class="toolbar-title">ROI Training Presentation</div>
        
        <div class="toolbar-controls">
            <button id="export-pdf-btn" class="icon-btn" aria-label="Print / Export to PDF" title="Print / Export to PDF">🖨️</button>
            <button id="fullscreen-toggle" class="icon-btn" aria-label="Toggle Fullscreen" title="Toggle Fullscreen (F)">⛶</button>
            <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme" title="Toggle Theme (Light/Dark)">🌙</button>
            <div class="font-controls">
                <button id="font-decrease" class="font-btn" aria-label="Decrease Font Size" title="Decrease Font Size">A-</button>
                <button id="font-increase" class="font-btn" aria-label="Increase Font Size" title="Increase Font Size">A+</button>
            </div>
        </div>
    </header>

    <!-- Floating Right-Side Annotation Dock (Visible in Fullscreen Mode) -->
    <div id="annotation-dock" class="annotation-dock" aria-label="Annotation Controls">
        <button id="pen-tool-btn" class="icon-btn tool-btn" aria-label="Pen Tool" title="Pen (P)" data-tooltip="Pen (P)">✏️</button>
        <button id="highlighter-tool-btn" class="icon-btn tool-btn" aria-label="Highlighter Tool" title="Highlighter (H)" data-tooltip="Highlighter (H)">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M15.245 2.227a1.5 1.5 0 0 1 2.121 0l4.407 4.407a1.5 1.5 0 0 1 0 2.121l-9.193 9.193a1.5 1.5 0 0 1-.74.405l-4.502 1.125a.75.75 0 0 1-.91-.91l1.125-4.502a1.5 1.5 0 0 1 .405-.74l9.193-9.193zM3.75 21h16.5a.75.75 0 0 1 0 1.5H3.75a.75.75 0 0 1 0-1.5z"/></svg>
        </button>
        <button id="clear-canvas-btn" class="icon-btn tool-btn" aria-label="Clear Slide" title="Clear Slide (C)" data-tooltip="Clear Slide (C)">🧹</button>
        <button id="delete-all-canvas-btn" class="icon-btn tool-btn" aria-label="Delete All" title="Delete All" data-tooltip="Delete All">🗑️</button>
    </div>

    <!-- Slide Presentation Stage -->
    <main id="presentation-stage" class="presentation-stage">
        <button id="stage-prev-btn" class="nav-arrow prev-arrow" aria-label="Previous Slide" title="Previous Slide (← / PageUp)">&#10094;</button>
        
        <div id="slide-card" class="slide-card">
            <!-- Annotation Drawing Canvas Overlay -->
            <canvas id="annotation-canvas" class="annotation-canvas"></canvas>

            <!-- Top Dark Blue Accent Line -->
            <div class="slide-top-bar"></div>
            
            <!-- Slide Body Content -->
            <div id="slide-body" class="slide-body">
                <div class="slide-loading">Loading course slides...</div>
            </div>

            <!-- Integrated ROI Training Footer -->
            <footer class="roi-slide-footer">
                <div id="footer-course-title" class="footer-cell footer-course">815: Hands-On Terraform</div>
                
                <div id="footer-copyright" class="footer-cell footer-copyright">
                    © 2026 Copyright ROI Training, Inc.<br>
                    All rights reserved. Not to be reproduced without prior written consent.
                </div>
                
                <div class="footer-cell footer-logo">
                    <img src="images/roi-logo.png" alt="ROI Training" class="roi-logo-img">
                    ROI Training, Inc.
                </div>
                
                <div id="footer-slide-number" class="footer-cell footer-number">1 of 1</div>
            </footer>
        </div>

        <button id="stage-next-btn" class="nav-arrow next-arrow" aria-label="Next Slide" title="Next Slide (→ / Space / PageDown)">&#10095;</button>
    </main>

    <!-- Slide Drawer / Table of Contents -->
    <nav id="side-menu" class="side-menu">
        <div class="menu-header">
            <h2>Course Slides</h2>
            <button id="close-menu" class="close-btn" aria-label="Close Slide List">&times;</button>
        </div>
        <ul id="slide-list"></ul>
    </nav>

    <!-- Hidden Container for PDF Export Printing -->
    <div id="print-stage" class="print-stage"></div>

    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for Code Syntax Highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- html2pdf.js for Direct PDF File Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Slide Viewer App Logic -->
    <script src="app.js"></script>
</body>
</html>
